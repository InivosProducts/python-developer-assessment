<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Result Viewer</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1b;--mute:#6b6b66;--line:#e3e2dd;--acc:#2f5bd3;--acc-soft:#e8eefc;--ok:#1f7a4d;--ok-soft:#e5f4ec;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#1f1f1e;--ink:#ecebe6;--mute:#a09f99;--line:#33332f;--acc:#7c9cf5;--acc-soft:#232c45;--ok:#5cc28f;--ok-soft:#1b3127;--bad:#f08a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 80px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:block;font-weight:600;margin:0 0 6px}
input[type=password],textarea{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical}
button{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;cursor:pointer}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button:disabled{opacity:.55;cursor:default}
.err{color:var(--bad);margin-top:10px;min-height:1.2em}
.msg{color:var(--ok);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.stat{background:var(--bg);border-radius:8px;padding:10px 12px}.stat b{display:block;font-size:1.2rem}.stat span{color:var(--mute);font-size:.85rem}
iframe{width:100%;height:900px;border:1px solid var(--line);border-radius:8px;background:#fff}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <h1>Result viewer</h1>
  <p class="sub">Open a candidate's result file to see their full result, for example when the result email didn't arrive.</p>

  <form class="card" id="form">
    <label class="f" for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="f" for="file" style="margin-top:14px">Result file</label>
    <input type="file" id="file" accept=".txt,text/plain">
    <p class="sub" style="margin:8px 0 6px;font-size:.9rem">Or paste the file's contents, or the <code>RESULT FILE: PDA1.…</code> line from the Vercel logs:</p>
    <textarea id="paste" placeholder="PDA1.…"></textarea>
    <div class="row" style="margin-top:12px"><button class="primary" id="viewBtn" type="submit">Open result</button></div>
    <div class="err" id="err"></div>
  </form>

  <div class="card hidden" id="out">
    <div class="stats">
      <div class="stat"><span>Candidate</span><b id="oName"></b></div>
      <div class="stat"><span>Score</span><b id="oScore"></b></div>
      <div class="stat"><span>Submitted</span><b id="oWhen" style="font-size:1rem"></b></div>
    </div>
    <div class="row" style="margin-bottom:12px">
      <button id="resendBtn" type="button">Email this result again</button>
      <button id="saveBtn" type="button">Download report (HTML)</button>
    </div>
    <div class="msg" id="msg"></div>
    <iframe id="frame" sandbox title="Result report"></iframe>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
let current=null,text="";

async function call(action){
  const r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("pw").value,receipt:text,action})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||"Something went wrong ("+r.status+").");
  return j;
}

$("form").addEventListener("submit",async e=>{
  e.preventDefault();$("err").textContent="";$("msg").textContent="";
  const f=$("file").files[0];
  text=f?await f.text():$("paste").value;
  if(!/PDA1\.[A-Za-z0-9_-]+/.test(text)){$("err").textContent="Choose a result file or paste its contents.";return}
  $("viewBtn").disabled=true;
  try{
    current=await call("view");
    $("oName").textContent=current.name+(current.email?" ("+current.email+")":"");
    $("oScore").textContent=`${current.total} / ${current.max} (${current.percent}%)`;
    $("oWhen").textContent=new Date(current.submittedAt).toLocaleString();
    $("frame").srcdoc=current.html;
    $("out").classList.remove("hidden");$("out").scrollIntoView({behavior:"smooth"});
  }catch(err){$("err").textContent=err.message;$("out").classList.add("hidden")}
  $("viewBtn").disabled=false;
});

$("resendBtn").onclick=async()=>{
  $("resendBtn").disabled=true;$("msg").textContent="Sending…";
  try{const j=await call("resend");$("msg").textContent="Sent to the results inbox (Mailgun id "+j.id+").";}
  catch(err){$("msg").textContent="";$("err").textContent=err.message;$("form").scrollIntoView()}
  $("resendBtn").disabled=false;
};

$("saveBtn").onclick=()=>{
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([`<!doctype html><meta charset="utf-8"><title>${current.subject.replace(/</g,"&lt;")}</title>`+current.html],{type:"text/html"}));
  a.download="result-"+current.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+".html";
  document.body.appendChild(a);a.click();a.remove();
};
</script>
</body>
</html>
